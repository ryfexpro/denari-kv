<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Квартиры Denari</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#05070b; --panel:#0c1018; --panel2:#111722; --line:#1c2433; --fg:#e8edf6; --mute:#8b97ab; --dim:#5a6578;
  --accent:#2f7bff; --accent-ink:#fff; --amber:#f2b25c; --good:#5bd38a; --bad:#ff7a6b; --violet:#b9a2ff; --pink:#ff8fa3;
  --display:"Unbounded","Onest",system-ui,sans-serif; --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding:0 max(14px,env(safe-area-inset-right,0px)) 80px max(14px,env(safe-area-inset-left,0px))}
.wrap{max-width:820px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.logo{font-family:var(--display);font-weight:700;font-size:15px;display:flex;gap:9px;align-items:center}
.logo i{width:24px;height:24px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px}
.sp{flex:1}.who{font-size:12px;color:var(--mute)}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:none}nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding-top:14px;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--display);font-weight:500;font-size:20px;margin:0}
.sub{color:var(--mute);margin:2px 0 0;font-size:13.5px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 12px;font-size:14px;font-weight:500}
button:disabled{opacity:.4}
button.go{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
button.warn{border-color:color-mix(in srgb,var(--amber) 60%,var(--line));color:var(--amber)}
button.sm{padding:5px 9px;font-size:13px}
.dnav{display:flex;align-items:center;gap:8px}.dnav b{font-family:var(--display);font-weight:500;font-size:17px;flex:1;text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.st{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 11px}.st b{display:block;font-family:var(--mono);font-size:19px;font-weight:500}.st span{color:var(--mute);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;border-left:3px solid var(--sc,var(--line))}
.h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.apt{font-weight:700;font-size:15.5px}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:480px){.flow{grid-template-columns:1fr}}
.leg{background:var(--panel2);border-radius:10px;padding:8px 10px;min-width:0}.leg .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);font-weight:600}.leg .v{font-weight:600}.leg .m{color:var(--mute);font-size:13px}
select,input,textarea{font:inherit;font-size:15px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0;width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);flex:1 1 140px}.sheet>label.f,form.sheet>label.f{flex:none}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}@media(max-width:440px){.photos{grid-template-columns:repeat(3,1fr)}}
.ph{aspect-ratio:1;border-radius:9px;border:1px dashed var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--mute);text-align:center;position:relative;overflow:hidden;padding:4px}
.ph.done{border-style:solid;border-color:var(--good)}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.ph input{position:absolute;inset:0;opacity:0}
.cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;padding:2px 4px;text-align:center;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .ic{font-size:20px;line-height:1}.ph.busy::after{content:"…";position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font-size:22px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px}.gal a{display:block;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--panel2)}.gal img{width:100%;height:100%;object-fit:cover}
.note{font-size:13px;color:var(--mute)}
.remark{background:color-mix(in srgb,var(--amber) 10%,var(--panel2));border:1px solid color-mix(in srgb,var(--amber) 35%,var(--line));border-radius:10px;padding:8px 10px;font-size:14px}
.sheet{background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}.sheet .grid{display:flex;flex-wrap:wrap;gap:8px}
pre{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:var(--body);font-size:13px;margin:0;max-height:320px;overflow:auto;user-select:text}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500;font-size:12px}td.n{font-family:var(--mono);text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}.toast.on{opacity:1}.toast.err{background:var(--bad);color:#fff}
.cal{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.crow{display:grid;grid-template-columns:118px repeat(14,46px);min-height:38px;border-bottom:1px solid var(--line);position:relative}
.crow:last-child{border-bottom:0}
.cname{grid-column:1;grid-row:1;position:sticky;left:0;z-index:2;background:var(--panel);padding:8px;font-size:12.5px;font-weight:600;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cday{grid-row:1;border-right:1px solid color-mix(in srgb,var(--line) 60%,transparent);position:relative}
.cday.we{background:color-mix(in srgb,var(--fg) 3%,transparent)}.cday.td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chead .cday{font-size:11px;text-align:center;padding:4px 0;color:var(--mute);cursor:pointer;line-height:1.2}.chead .cday b{display:block;color:var(--fg);font-size:13px}
.bk{grid-row:1;align-self:center;height:26px;border-radius:7px;background:color-mix(in srgb,var(--accent) 75%,var(--panel));color:#fff;font-size:11.5px;font-weight:600;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;cursor:pointer;z-index:1;border:0;font-family:inherit}
.bk.ex{background:color-mix(in srgb,var(--pink) 70%,var(--panel))}.bk.ns{background:var(--line);color:var(--mute);text-decoration:line-through}
.cdot{position:absolute;left:50%;bottom:3px;width:7px;height:7px;border-radius:50%;transform:translateX(-50%)}
.occ .cday{font-family:var(--mono);font-size:11.5px;text-align:center;padding-top:10px;color:var(--mute)}
.code{font-family:var(--mono);font-size:12.5px;word-break:break-all;background:var(--panel2);border-radius:8px;padding:8px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top"><div class="logo"><i>D</i>Квартиры Denari</div><div class="sp"></div><div class="who" id="who"></div></div>
  <nav id="tabs"></nav>
</header>
<main id="view"><div class="empty">Загрузка…</div></main>
</div>
<div class="toast" id="toast"></div>
<script>
const API="https://zsrddmgiefmuwvcobkin.supabase.co/functions/v1/kv-api";
const PAY_ACTIONS=new Set(["payroll","payout_mark","staff_rate","apt_rates","apt_rate","apt_grate","calendar"]);
const BOT="apartmanager_bot";
const TG=window.Telegram?.WebApp; TG?.ready(); TG?.expand?.();
let SLOTS=[["rooms","Комнаты"],["kitchen","Кухня"],["bath","Туалет и ванная"],["wardrobe","Шкафы"],["fridge","Холодильник"],["microwave","Микроволновка"],["linen","Шкаф с доп. бельём"],["key","Ключи в локбоксе"]];
const slotName=k=>(SLOTS.find(x=>x[0]===k)||[k,{bath:"Ванная",beds:"Кровати",repair:"Ремонт"}[k]||k])[1];
const SS={wait:["Ждёт уборки","var(--mute)"],progress:["Убирает","var(--accent)"],review:["На проверке","var(--violet)"],remark:["Замечание","var(--amber)"],ok:["Принято","var(--good)"]};
const METH=[["cash","MDL","Нал лей"],["cash","EUR","Нал €"],["card","MDL","Карта"],["revolut","EUR","Revolut"]];
let me=null, ui={tab:"day",date:today(),sheet:null,open:null}, cache={day:[],staff:[],apts:[],repairs:[],gal:{},up:{}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chip=(t,c)=>`<span class="chip" style="--c:${c}">${t}</span>`;
function today(o=0){const d=new Date();d.setDate(d.getDate()+o);return d.toLocaleDateString("sv-SE")}
const shiftDate=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.toLocaleDateString("sv-SE")};
const ru=s=>{const d=new Date(s+"T12:00:00");return d.toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long"})};
const dm=s=>s?s.slice(8,10)+"."+s.slice(5,7):"";
function toast(m,err){const t=document.getElementById("toast");t.textContent=m;t.className="toast on"+(err?" err":"");clearTimeout(toast.h);toast.h=setTimeout(()=>t.className="toast",err?3500:2200);try{TG?.HapticFeedback?.notificationOccurred(err?"error":"success")}catch(e){}}
async function call(action,body={}){
  const r=await fetch(PAY_ACTIONS.has(action)?API.replace("kv-api","kv-pay"):API,{method:"POST",headers:{"content-type":"application/json","x-tg-init":TG?.initData||""},body:JSON.stringify({action,...body})});
  const j=await r.json().catch(()=>({error:"Нет связи с сервером"}));
  if(!r.ok||j.error){const e=new Error(j.error||"Ошибка");e.payload=j;e.status=r.status;throw e}
  return j.data??j;
}
const isAdmin=()=>me&&(me.role==="owner"||me.role==="admin");
const canDispatch=()=>isAdmin()||me?.role==="dispatcher";

async function boot(){
  const v=document.getElementById("view");
  if(!TG?.initData){v.innerHTML=`<div class="empty">Откройте приложение через Telegram-бота <b>@${BOT}</b>.</div>`;return}
  const code=TG.initDataUnsafe?.start_param||new URLSearchParams(location.search).get("c");
  try{
    if(code){try{const r=await call("bind",{code});toast("Добро пожаловать, "+r.staff.name)}catch(e){if(e.status!==404)throw e}}
    me=await call("me");
  }catch(e){
    if(e.payload?.error==="not_registered"){v.innerHTML=`<div class="empty">Вы ещё не в команде.<br>Попросите админа прислать ссылку-приглашение.<br><br><span class="note">Ваш Telegram ID: ${e.payload.tg_id}</span></div>`;return}
    v.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return;
  }
  if(Array.isArray(me.slots)&&me.slots.length) SLOTS=me.slots.map(x=>[x.k,x.n]);
  document.getElementById("who").textContent=me.name+" · "+({owner:"владелец",admin:"админ",dispatcher:"помощник",cleaner:"пчёлка",master:"мастер",manager:"менеджер"}[me.role]||me.role);
  ui.tab=me.role==="master"?"rep":"day";
  if(canDispatch()){[cache.staff,cache.apts]=await Promise.all([call("staff"),call("apartments")])} else {cache.apts=await call("apartments").catch(()=>[])}
  await load();
}
async function load(){
  try{
    if(ui.tab==="day"||ui.tab==="pay") cache.day=await call("day",{date:ui.date});
    if(me.role==="cleaner"&&ui.tab==="day") for(const x of cache.day) for(const c of [x.cleaning,x.general]){
      if(c&&c.status==="progress"&&c.photos>0&&!cache.up[c.id]){const g=await call("photos",{cleaning_id:c.id});cache.up[c.id]={};for(const p of g){const u=cache.up[c.id][p.slot];if(u)u.n++;else cache.up[c.id][p.slot]={url:p.url,n:1}}}}
    if(ui.tab==="rep") cache.repairs=await call("repairs");
    if(ui.tab==="cal"){if(!ui.cal)ui.cal=today(-2);cache.cal=await call("calendar",{from:ui.cal,to:shiftDate(ui.cal,13)})}
    if(ui.tab==="team") cache.staff=await call("staff");
    if(ui.tab==="guests"){if(!ui.gfrom)ui.gfrom=today(-1);cache.guests=(await call("guests",{from:ui.gfrom,to:shiftDate(ui.gfrom,14)})).map(g=>({...g,id:+g.id}));
      if(ui.sheet==="gset")cache.gset=await call("guest_settings");if(ui.sheet==="ainfo")cache.ainfo=await call("apt_info")}
    if(ui.tab==="sal"){if(!ui.wk)ui.wk=weekOf(today(-7));cache.pay=await call("payroll",{from:ui.wk[0],to:ui.wk[1]});if(ui.sheet==="rates")cache.rates=await call("apt_rates")}
    if(ui.tab==="money") cache.money=await call("money",{from:ui.date.slice(0,8)+"01",to:ui.date});
  }catch(e){toast(e.message,1)}
  render();
}
function tabs(){
  const t=me.role==="cleaner"?[["day","Мои уборки"],["rep","Ремонт"]]:me.role==="master"?[["rep","Ремонт"]]:me.role==="dispatcher"?[["day","График"],["cal","Календарь"],["rep","Ремонт"]]:me.role==="manager"?[["day","График"],["cal","Календарь"],["pay","Оплаты"]]:
    [["day","График"],["cal","Календарь"],["guests","Гости"],["pay","Оплаты"],["sal","Зарплаты"],["rep","Ремонт"],["team","Команда"]].concat(me.role==="owner"?[["money","Деньги"]]:[]);
  return t.map(([k,n])=>`<button class="${ui.tab===k?"on":""}" data-tab="${k}">${n}</button>`).join("");
}
function dateNav(){return `<div class="dnav"><button class="sm" data-d="-1">‹</button><b>${ru(ui.date)}${ui.date===today()?" · сегодня":ui.date===today(1)?" · завтра":""}</b><button class="sm" data-d="1">›</button></div>`}

function legs(x){
  const o=x.out?`<div class="leg"><div class="l">Выезд</div><div class="v">${esc(x.out.name||"гость")}${x.out.time?" · "+esc(x.out.time):""}</div></div>`:`<div class="leg"><div class="l">Выезд</div><div class="m">нет</div></div>`;
  const i=x.in?`<div class="leg"><div class="l">Заезд ${x.in.source==="extra"?chip("Экстра","var(--pink)"):""} ${x.in.no_show?chip("Незаезд","var(--bad)"):""} ${isAdmin()&&x.in.guest_status?chip(GS[x.in.guest_status][0],GS[x.in.guest_status][1]):""}</div><div class="v">${esc(x.in.name||"гость")} · ${x.in.guests??"?"} взр · ${x.in.nights} ${x.in.nights>1?"ночи":"ночь"}${x.in.time?" · "+esc(x.in.time):""}</div>${isAdmin()&&x.in.price!=null?`<div class="m">${payLabel(x.in)} · ${x.in.price} ${x.in.currency}</div>`:""}</div>`
    :x.stay_until?`<div class="leg"><div class="l">Проживают</div><div class="v">до ${dm(x.stay_until)}</div></div>`
    :`<div class="leg"><div class="l">Заезд</div><div class="v">Подготовить на ${x.cleaning?.prep??"?"}</div></div>`;
  return `<div class="flow">${o}${i}</div>`;
}
const payLabel=i=>i.pay_status==="ota_paid"?"оплачено Booking":i.paid?.length?"оплачено":"оплата на месте";

function beeChips(c){
  const cleaners=cache.staff.filter(s=>s.role==="cleaner"&&s.active), on=new Set((c.cleaners||[]).map(p=>p.id));
  return `<div class="bar" style="gap:6px">🐝 ${cleaners.length?cleaners.map(s=>`<button class="sm ${on.has(s.id)?"go":""}" data-bee="${c.id}" data-sid="${s.id}">${esc(s.name)}</button>`).join(""):`<span class="note">Добавь пчёлок во вкладке «Команда»</span>`}</div>
  ${on.size>1&&isAdmin()?`<label class="note" style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" data-payeach="${c.id}" ${c.pay_each?"checked":""}> каждой полная ставка (иначе делится поровну)</label>`:""}`;
}
function cleanBlock(c){
  const [sn,sc]=SS[c.status];
  return `${c.kind==="general"?`<div class="h"><b>🧽 Генеральная уборка</b>${chip(sn,sc)}</div>${c.note?`<div class="note">${esc(c.note)}</div>`:""}`:""}
    ${c.status==="remark"&&c.remark?`<div class="remark">Замечание: ${esc(c.remark)}</div>`:""}
    ${beeChips(c)}
    <div class="bar"><button class="sm" data-gal="${c.id}">Фото (${c.photos})</button>
      ${c.status==="review"?`<button class="sm go" data-ok="${c.id}">Принять</button><button class="sm warn" data-rem="${c.id}">Замечание</button>`:""}
      ${c.kind==="general"&&c.status==="wait"?`<button class="sm" data-gdel="${c.id}">Удалить</button>`:""}</div>
    ${ui.open==="gal"+c.id?gallery(c.id):""}
    ${ui.sheet==="rem"+c.id?`<div class="sheet"><textarea id="rt" rows="2" placeholder="Что исправить: например, сковородка слева грязная по краям"></textarea><div class="bar"><button class="go" data-dorem="${c.id}">Отправить пчёлкам</button><button data-act="close">Отмена</button></div></div>`:""}`;
}
function generalForm(){const cleaners=cache.staff.filter(s=>s.role==="cleaner"&&s.active);return `<form class="sheet" id="genf"><b>🧽 Генеральная уборка</b><div class="grid">
  <label class="f">Квартира<select id="g-a">${cache.apts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join("")}</select></label>
  <label class="f">Дата<input id="g-d" type="date" value="${ui.date}" required></label></div>
  <label class="f">Что сделать<input id="g-n" placeholder="Например: окна, шторы, духовка, холодильник"></label>
  <div class="note">Пчёлки:</div><div class="bar">${cleaners.map(s=>`<label class="note" style="display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto" class="g-bee" value="${s.id}">${esc(s.name)}</label>`).join("")||"нет пчёлок"}</div>
  <div class="bar"><button class="go" type="submit">Создать</button><button type="button" data-act="close">Отмена</button></div></form>`}

function viewDay(){
  const rows=cache.day, all=rows.flatMap(x=>[x.cleaning,x.general].filter(Boolean)), stay=rows.filter(x=>!x.cleaning&&!x.general&&x.stay_until&&!x.in);
  if(me.role==="cleaner") return viewCleaner(rows);
  const n=s=>all.filter(c=>c.status===s).length;
  return `${dateNav()}
  <div class="stats"><div class="st"><b>${n("wait")+n("progress")}</b><span>уборок осталось</span></div><div class="st"><b style="color:var(--violet)">${n("review")}</b><span>ждут проверки</span></div><div class="st"><b style="color:var(--amber)">${n("remark")}</b><span>замечания</span></div><div class="st"><b style="color:var(--good)">${n("ok")}</b><span>принято</span></div></div>
  <div class="bar">${isAdmin()?`<button class="go" data-act="extra">+ Бронь</button>`:""}<button data-act="general">+ Генеральная</button><button data-act="viber">Текст для Viber</button></div>
  ${ui.sheet==="extra"?extraForm():""}${ui.sheet==="general"?generalForm():""}
  ${ui.sheet==="viber"?`<div class="sheet"><b>График на ${dm(ui.date)}</b><pre id="vtxt">${esc(viberText())}</pre><div class="bar"><button class="go" data-act="copy">Копировать</button><button data-act="close">Закрыть</button></div></div>`:""}

async function compress(file){
  const img=await createImageBitmap(file).catch(()=>null);
  if(!img) return file;
  const s=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.75));
}
async function upload(url,blob){
  for(let i=0;i<3;i++){try{const r=await fetch(url,{method:"PUT",headers:{"content-type":"image/jpeg","x-upsert":"true"},body:blob});if(r.ok)return true}catch(e){}await new Promise(r=>setTimeout(r,1500*(i+1)))}
  return false;
}

    else if(d.on){await call("staff_set_active",{id:+d.on,active:true});cache.staff=await call("staff");toast("Доступ возвращён")}
    else if(d.relink){const r=await call("staff_relink",{id:+d.relink});cache.staff=await call("staff");const l=`https://t.me/${BOT}?start=${r.invite_code}`;try{await navigator.clipboard.writeText(l);toast("Старый вход отключён, новая ссылка скопирована")}catch(_){toast("Новая ссылка — в таблице")}}
    else if(d.wk){ui.wk=weekOf(shiftDate(ui.wk[0],+d.wk));await load();return}
    else if(d.act==="rates"){ui.sheet=ui.sheet==="rates"?null:"rates";await load();return}
    else if(d.payout){await call("payout_mark",{staff_id:+d.payout,from:ui.wk[0],to:ui.wk[1]});toast("Отмечено: выплачено");await load();return}
    else if(d.unpay){await call("payout_mark",{staff_id:+d.unpay,from:ui.wk[0],to:ui.wk[1],undo:true});await load();return}
    else if(d.cal){ui.cal=shiftDate(ui.cal,+d.cal);ui.bk=null;await load();return}
    else if(d.bk){ui.bk=+d.bk}
    else if(d.act==="closebk"){ui.bk=null}
    else if(d.bee){const c=cache.day.flatMap(x=>[x.cleaning,x.general]).find(c=>c&&c.id===+d.bee);const ids=new Set((c?.cleaners||[]).map(p=>p.id));const sid=+d.sid;ids.has(sid)?ids.delete(sid):ids.add(sid);
      await call("assign",{cleaning_id:+d.bee,cleaner_ids:[...ids]});toast(ids.has(sid)?"Назначено — пчёлка получила задание":"Пчёлка снята");await load();return}
    else if(d.act==="general"){ui.sheet=ui.sheet==="general"?null:"general"}
    else if(d.gdel){await call("general_delete",{cleaning_id:+d.gdel});toast("Генеральная удалена");await load();return}
    else if(d.gw){ui.gfrom=shiftDate(ui.gfrom,+d.gw);ui.sheet=ui.sheet==="ainfo"||ui.sheet==="gset"?ui.sheet:null;await load();return}
    else if(d.act==="ainfo"||d.act==="gset"){ui.sheet=ui.sheet===d.act?null:d.act;await load();return}
    else if(d.gsend){const id=+d.gsend,g=allGuests().find(x=>x.id===id);if(!g.guest_token){const r=await call("guest_link",{booking_id:id});g.guest_token=r.token}ui.sheet=ui.sheet==="gs"+id?null:"gs"+id}
    else if(d.gcopy){await guestShare(+d.gcopy,d.l,"copy")}
    else if(d.gwa){await guestShare(+d.gwa,d.l,"wa")}
    else if(d.gvb){await guestShare(+d.gvb,d.l,"vb")}
    else if(d.gdocs){const id=+d.gdocs;ui.open=ui.open==="gd"+id?null:"gd"+id;render();if(ui.open){cache.gdocs=cache.gdocs||{};cache.gdocs[id]=await call("guest_docs",{booking_id:id})}}
    else if(d.gctr){const id=+d.gctr,g=allGuests().find(x=>x.id===id);const r=await call("contract_print",{booking_id:id});const u=`${GUEST_URL}?p=${r.token}&l=${g?.guest?.contract_lang||"ro"}`;if(TG?.openLink)TG.openLink(u);else window.open(u,"_blank");toast("Договор открыт в браузере — там «Скачать / распечатать»");return}
    else if(d.act==="gqclear"){ui.gq="";cache.gsearch=[]}
    else if(d.gchk){await call("guest_check",{booking_id:+d.gchk,ok:true});toast("Отмечено: данные проверены");await load();return}
    else if(d.gunchk){await call("guest_check",{booking_id:+d.gunchk,ok:false});await load();return}
    else if(d.gxdel){ui.sheet="gx"+d.gxdel}
    else if(d.gdodel){await call("guest_docs_delete",{booking_id:+d.gdodel});ui.sheet=null;ui.open=null;toast("Фото документа удалены");await load();return}
    else if(d.copylink){const l=`https://t.me/${BOT}?start=${d.copylink}`;try{await navigator.clipboard.writeText(l);toast("Ссылка скопирована — отправь сотруднику")}catch(_){TG?.openTelegramLink?.(`https://t.me/share/url?url=${encodeURIComponent(l)}`)}return}
    else return;
    render();
  }catch(err){toast(err.message,1)}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  try{
    if(t.dataset.glang){ui.glang=ui.glang||{};ui.glang[+t.dataset.glang]=t.value;render();return}
    if(t.dataset.aisel){ui.aid=+t.value;render();return}
    if(t.dataset.payeach){await call("set_pay_each",{cleaning_id:+t.dataset.payeach,value:t.checked});toast(t.checked?"Каждой — полная ставка":"Ставка делится поровну");return}
    if(t.dataset.srate){await call("staff_rate",{id:+t.dataset.srate,rate_lei:t.value===""?null:+t.value});toast("Ставка сохранена");await load();return}
    if(t.dataset.grate){await call("apt_grate",{id:+t.dataset.grate,rate_lei:t.value===""?null:+t.value});toast("Ставка генеральной сохранена");await load();return}
    if(t.dataset.arate){await call("apt_rate",{id:+t.dataset.arate,rate_lei:t.value===""?null:+t.value});toast("Ставка квартиры сохранена");await load();return}
    if(t.dataset.assign){if(!t.value)return;await call("assign",{cleaning_id:+t.dataset.assign,cleaner_id:+t.value});toast("Назначено — пчёлка получила сообщение");await load()}
    else if(t.dataset.ph){
      const f=t.files[0];if(!f)return;const id=+t.dataset.ph,slot=t.dataset.slot;cache.up[id]=cache.up[id]||{};const prev=cache.up[id][slot];cache.up[id][slot]={...(prev||{n:0}),busy:true};render();
      const blob=await compress(f);const u=await call("photo_upload_url",{cleaning_id:id,slot});
      if(!await upload(u.url,blob)){if(prev)cache.up[id][slot]=prev;else delete cache.up[id][slot];render();toast("Фото не загрузилось — проверь интернет и попробуй снова",1);return}
      await call("photo_add",{cleaning_id:id,slot,path:u.path});cache.up[id][slot]={url:URL.createObjectURL(blob),n:(prev?.n||0)+1};render();
    }
  }catch(err){toast(err.message,1)}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target,v=id=>document.getElementById(id)?.value;
  try{
    if(f.id==="exf"){const r=await call("booking_create",{apartment_id:+v("ex-a"),source:v("ex-src"),checkin:v("ex-ci"),checkout:v("ex-co"),checkin_time:v("ex-t")||null,guests:+v("ex-g")||null,price_total:v("ex-p")?+v("ex-p"):null,transfer_eur:v("ex-tr")?+v("ex-tr"):null,name:v("ex-n")||null,phone:v("ex-ph")||null});ui.sheet=null;toast("Бронь сохранена");await load();if(r.note)setTimeout(()=>toast(r.note),2400);return}
    if(f.id==="aif"){const info={notes:{}};f.querySelectorAll("[data-ai]").forEach(i=>info[i.dataset.ai]=i.value);f.querySelectorAll("[data-an]").forEach(i=>info.notes[i.dataset.an]=i.value);
      const id=ui.aid||cache.ainfo[0].id;cache.ainfo=await call("apt_info",{id,info});ui.aid=id;toast("Инструкция сохранена");render();return}
    if(f.id==="gsf2"){ui.gq=v("gq").trim();cache.gsearch=ui.gq.length>=2?(await call("guest_search",{q:ui.gq})).map(g=>({...g,id:+g.id})):[];render();return}
    if(f.id==="gsf"){const rules={};f.querySelectorAll("[data-gr]").forEach(i=>rules[i.dataset.gr]=i.value);
      cache.gset=await call("guest_settings",{value:{company:v("gs-co"),contact_phone:v("gs-ph"),checkin_from:v("gs-in"),checkout_until:v("gs-out"),rules}});toast("Настройки сохранены");render();return}
    if(f.id==="genf"){const ids=[...document.querySelectorAll(".g-bee:checked")].map(x=>+x.value);await call("general_create",{apartment_id:+v("g-a"),date:v("g-d"),note:v("g-n")||null,cleaner_ids:ids});ui.sheet=null;ui.date=v("g-d");toast("Генеральная уборка создана");await load();return}
    if(f.dataset.payf){await call("pay",{booking_id:+f.dataset.payf,amount:+v("pa"),currency:v("pc"),method:ui.payM});ui.sheet=null;toast("Оплата записана");await load();return}
    if(f.id==="invf"){const r=await call("invite",{name:v("iv-n"),role:v("iv-r"),rate_lei:v("iv-rate")?+v("iv-rate"):null});const l=`https://t.me/${BOT}?start=${r.invite_code}`;cache.staff=await call("staff");render();try{await navigator.clipboard.writeText(l);toast("Приглашение создано, ссылка скопирована")}catch(_){toast("Приглашение создано — ссылка в таблице")}return}
    if(f.dataset.probf){
      const aid=f.dataset.probf==="any"?+v("pa-apt"):+f.dataset.probf;let path=null;const file=document.getElementById("pf")?.files?.[0];
      if(file){const u=await call("repair_upload_url",{apartment_id:aid});if(await upload(u.url,await compress(file)))path=u.path}
      await call("repair_create",{apartment_id:aid,title:v("pt"),photo_path:path});ui.sheet=null;toast("Отправлено в ремонт");if(ui.tab==="rep")await load();else render();return}
  }catch(err){toast(err.message,1)}
});
boot();
</script>
</body>
</html>
